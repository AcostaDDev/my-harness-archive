# Synthetic checks only: no secrets, provider CLIs, logins, model calls or publication.
# Actions are pinned by commit; the tag in each comment is the release that commit belongs to.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # The only platform the project has tested (macOS on Apple silicon).
    runs-on: macos-15
    timeout-minutes: 60
    env:
      UV_CACHE_DIR: .local/uv-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: 0.12.19
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Pin npm and Python
        run: |
          test "$(npm --version)" = 11.12.1 || npm install --global npm@11.12.1
          uv python install 3.14.4
      # The only steps with network access to package registries; everything after them runs offline.
      - name: Fill the local caches
        run: |
          uv sync --frozen --no-python-downloads
          npm --prefix frontend ci --ignore-scripts --cache .local/npm-cache
      - name: unittest
        run: uv run --frozen --offline python -m unittest discover -s tests -p 'test_*.py'
      - name: pytest
        run: uv run --frozen --offline pytest -q
      - name: Alembic metadata
        env:
          HARNESS_DATABASE_URL: sqlite:///${{ runner.temp }}/alembic-check.sqlite3
        run: |
          uv run --frozen --offline alembic upgrade head
          uv run --frozen --offline alembic check
      - name: Frontend tests and types
        run: |
          node --test frontend/tests/*.test.mjs
          npm --prefix frontend run check
      - name: Build and verify the package
        run: |
          uv run --frozen --offline python scripts/build_distribution.py --out-dir "$RUNNER_TEMP/package"
          uv run --frozen --offline python scripts/check_distribution.py --dist "$RUNNER_TEMP/package"
          cat "$RUNNER_TEMP/package/SHA256SUMS"
