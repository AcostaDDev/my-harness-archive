[project]
name = "harness-local"
version = "0.1.0"
description = "Esqueleto local de Harness Local"
license = "MIT"
authors = [{ name = "David Acosta" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.143.0",
    "pydantic==2.14.0",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.4",
    "alembic==1.20.0",
]

[project.scripts]
harness-local = "harness_local.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "pytest-xdist==3.8.0"]

[build-system]
requires = ["uv_build==0.12.19"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# Paralelo por defecto (D125); `-n 0` ejecuta en serie, p. ej. para depurar una prueba.
addopts = "-n auto --dist worksteal"
