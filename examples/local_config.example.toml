# Harness Local — configuración de uso real (local-config-1). Plantilla, no válida tal cual.
# Guardar FUERA de cualquier checkout, propietario el usuario del servicio, chmod 600.
# Sin secretos: la autenticación sigue en cada CLI. Rutas absolutas canónicas.
# Validar:  harness-local check-config /ruta/harness-local.toml [--preflight]
# Arrancar: harness-local serve --database /ruta/state/harness.sqlite3 --config /ruta/harness-local.toml
format = "local-config-1"

[service]
state_dir = "/RUTA/ABSOLUTA/harness-state"   # artefactos CLI y migraciones; fuera de los checkouts
supervisor = false                            # true: ejecuta la cola al arrancar
# lease_seconds = 30.0
# poll_seconds = 0.5

[git]
executable = "/usr/bin/git"
author_name = "Nombre Autor"
author_email = "autor@example.invalid"

[providers.codex]                             # planificador/revisor, solo lectura
executable = ["/RUTA/ABSOLUTA/codex"]
cli_version = "0.162.1"                       # baseline caracterizado; otra versión se rechaza
timeout_seconds = 1800
environment = { HOME = "/Users/USUARIO", USER = "USUARIO", PATH = "/usr/bin:/bin", LANG = "C.UTF-8" }

[providers.claude]                            # ejecutor
executable = ["/RUTA/ABSOLUTA/claude"]
cli_version = "2.1.295"
timeout_seconds = 3600
environment = { HOME = "/Users/USUARIO", USER = "USUARIO", PATH = "/usr/bin:/bin", LANG = "C.UTF-8" }
tools = ["Read", "Edit", "Write", "Glob", "Grep"]
allowed_tools = ["Read", "Edit", "Write", "Glob", "Grep"]
# grantable_tools = []                        # herramientas concedibles por H3.2

[[projects]]
id = "mi-web"
root = "/RUTA/ABSOLUTA/checkout-desechable"   # worktree/checkout Git; mejor desechable al empezar
repository_trusted = true                     # confianza en scripts/configuración del repositorio
profile = "typescript-web"                    # único perfil admitido en local-config-1
# tag_kind = "lightweight"                    # o "annotated"

[projects.policy]                             # elección explícita del usuario; sin valores por defecto
executor_models = ["MODELO-CLAUDE"]
executor_efforts = ["medium"]
planner_model = "MODELO-CODEX"
planner_effort = "medium"
reviewer_model = "MODELO-CODEX"
reviewer_effort = "high"
# max_revision_cycles = 3
# planning_mode = "auto"

[projects.commands]                           # ManagedCommandRunner (D047): argv sin shell, sin herencia
authorize_profile_commands = true             # autoriza exactamente preparación y validaciones del perfil
executables = { node = "/RUTA/ABSOLUTA/node", npm = "/RUTA/ABSOLUTA/npm" }
environment = { PATH = "/RUTA/ABSOLUTA/bin:/usr/bin:/bin", HOME = "/RUTA/PRIVADA/home-comandos", LANG = "C.UTF-8", CI = "true", npm_config_cache = "/RUTA/ABSOLUTA/npm-cache", npm_config_update_notifier = "false" }
# max_timeout_seconds = 1800
# max_output_bytes = 65536

# Variante exacta adicional (p. ej. una orden del contrato con timeout por defecto):
# [[projects.commands.authorized]]
# argv = ["npm", "run", "test"]
# timeout_seconds = 1800
